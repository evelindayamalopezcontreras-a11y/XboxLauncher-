name: Build Xbox Launcher APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordenar archivos
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/xboxlauncher/android
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv ic_launcher.xml app/src/main/res/drawable/
          mv MainActivity.java app/src/main/java/com/xboxlauncher/android/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XboxLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
